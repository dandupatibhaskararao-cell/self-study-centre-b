options:[

let current=0;
let answers=new Array(25).fill(null);
let review=new Array(25).fill(false);
let submitted=false;

let time=20*60;

function render(){

let q=questions[current];

document.getElementById("quiz").innerHTML=`

<div class="card">

<div class="question">
${q.q}
</div>

${q.options.map((op,i)=>`

<label class="option">

<input type="radio"
name="answer"
value="${i}"
${answers[current]===i?"checked":""}
onchange="selectAnswer(${i})">

${String.fromCharCode(65+i)}. ${op}

</label>

`).join("")}

<div class="buttons">

<button class="prev" onclick="previousQuestion()">
↩️ Previous
</button>

<button class="save" onclick="saveNext()">
✅ Save & Next
</button>

<button class="review" onclick="markReview()">
🔖 Mark for Review
</button>

<button class="clear" onclick="clearResponse()">
🧹 Clear Response
</button>

</div>

</div>
`;

updatePalette();

window.scrollTo(0,0);

}

function selectAnswer(i){

answers[current]=i;

updatePalette();

}

function saveNext(){

if(current<24){

current++;

render();

}else{

confirmSubmit();

}

}

function previousQuestion(){

if(current>0){

current--;

render();

}

}

function markReview(){

review[current]=true;

if(current<24){

current++;

}

render();

}

function clearResponse(){

answers[current]=null;

review[current]=false;

render();

}

function updatePalette(){

let html="";

for(let i=0;i<25;i++){

let cls="pbtn";

if(review[i]) cls+=" reviewed";

else if(answers[i]!==null) cls+=" answered";

html+=`

<button class="${cls}" onclick="goQuestion(${i})">
${i+1}
</button>

`;

}

document.getElementById("palette").innerHTML=html;

}

function goQuestion(i){

current=i;

render();

}

function confirmSubmit(){

if(submitted)return;

let unanswered=answers.filter(x=>x===null).length;

if(confirm(

"Exam Submit చేయాలా?\n\n"+
"Answered: "+(25-unanswered)+
"\nNot Answered: "+unanswered+

"\n\nSubmit చేయడానికి OK నొక్కండి."

)){

submitTest();

}

}

function submitTest(){

submitted=true;

clearInterval(timerInterval);

let correct=0;
let wrong=0;

answers.forEach((a,i)=>{

if(a===null)return;

if(a===questions[i].ans)
correct++;
else
wrong++;

});

let marks=correct-(wrong/3);

marks=Math.max(0,marks);

let percentage=(marks/25)*100;

let html=`

<h2>📊 Test Result</h2>

<h3>RRB GROUP D - TEST 02</h3>

<p>📝 Total Questions: <b>25</b></p>

<p class="correct">
✅ Correct: ${correct}
</p>

<p class="wrong">
❌ Wrong: ${wrong}
</p>

<p>
⚪ Not Answered: ${25-correct-wrong}
</p>

<p>
🎯 Marks: <b>${marks.toFixed(2)} / 25</b>
</p>

<p>
📈 Percentage: <b>${percentage.toFixed(2)}%</b>
</p>

<hr>

<h2>📖 Explanations</h2>

`;

questions.forEach((q,i)=>{

let user=answers[i];

let status="Not Answered";

if(user!==null){

if(user===q.ans)
status='<span class="correct">✅ Correct</span>';
else
status='<span class="wrong">❌ Wrong</span>';
}

html+=`

<div class="card">

<h3>Q.${i+1}</h3>

<p>${q.q}</p>

<p>
<b>Your Answer:</b>
${user===null?"Not Answered":q.options[user]}
</p>

<p>
<b>Correct Answer:</b>
<span class="correct">
${String.fromCharCode(65+q.ans)}. ${q.options[q.ans]}
</span>
</p>

<p>${status}</p>

<div class="explanation">

<b>💡 Explanation:</b><br>

${q.exp}

</div>

</div>

`;

});

document.getElementById("result").innerHTML=html;

document.getElementById("result").style.display="block";

document.getElementById("quiz").style.display="none";

document.querySelector(".container").scrollIntoView();

}

function updateTimer(){

let min=Math.floor(time/60);

let sec=time%60;

document.getElementById("timer").innerText=

String(min).padStart(2,"0")+":"+

String(sec).padStart(2,"0");

if(time<=0){

clearInterval(timerInterval);

alert("⏰ Time అయిపోయింది. Test automatically submitted.");

submitTest();

}

time--;

}

let timerInterval=setInterval(updateTimer,1000);

updateTimer();

render();

</script>

</body>
</html>
